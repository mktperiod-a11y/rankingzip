name: Fetch portraits (temporary)
on:
  push:
    branches: [claude/affectionate-einstein-6myk2z]
    paths: [scripts/fetch-portraits.mjs, .github/workflows/portraits-tmp.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-portraits.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ranking-images/portraits
          git commit -m "인물 사진: 위키미디어 공용 자유 이용 사진 수집" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
