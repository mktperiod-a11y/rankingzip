name: Update ranking data

on:
  schedule:
    - cron: "0 3 * * 3"
    - cron: "0 3 * * 6"
    - cron: "0 3 7 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "미리보기만 (저장하지 않음)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  netflix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: OTT 월간 공개 자료 확인
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 7 * *'
        continue-on-error: true
        run: node scripts/update-ott.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: 넷플릭스 TOP 10 갱신
        if: github.event.schedule != '0 3 7 * *'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/update-netflix.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: 바뀐 데이터 저장 후 사이트 재배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/rankings && [ -z "$(git status --porcelain public/ranking-images/netflix)" ]; then echo "바뀐 데이터가 없습니다"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/image-shapes.mjs
          git add data/rankings data/image-shapes.json public/ranking-images/netflix
          git commit -m "Update Netflix charts and OTT monthly users"
          git push
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

  anime:
    if: github.event.schedule != '0 3 7 * *'
    needs: netflix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 애니메이션 순위 갱신
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANIME_MISSING_FILE: ${{ runner.temp }}/anime-missing.txt
        run: node scripts/update-anime.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: 바뀐 데이터 저장 후 사이트 재배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/rankings && [ -z "$(git status --porcelain public/ranking-images/anime)" ]; then echo "바뀐 데이터가 없습니다"; exit 0; fi
          node scripts/image-shapes.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings data/image-shapes.json public/ranking-images/anime
          git commit -m "Update anime rankings"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
      - name: 한국어 제목 없는 작품 알림
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING: ${{ runner.temp }}/anime-missing.txt
        run: |
          [ -s "$MISSING" ] || exit 0
          title="애니메이션 한국어 제목 필요"
          body="$(printf '자동으로 한국어 제목을 찾지 못해 해당 순위는 이전 데이터를 유지했습니다. data/rankings/anime-titles-ko.json에 \"영어 제목\": \"한국어 제목\"을 추가하면 다음 갱신 때 반영됩니다.\n\n'; sed 's/^/- /' "$MISSING")"
          number="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi

  records:
    needs: anime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 기록 순위 갱신
        run: node scripts/update-records.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: 바뀐 데이터 저장 후 사이트 재배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/rankings/live && [ -z "$(git status --porcelain data/rankings/live public/ranking-images/cars)" ]; then echo "바뀐 데이터가 없습니다"; exit 0; fi
          node scripts/image-shapes.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings/live data/image-shapes.json public/ranking-images/cars
          git commit -m "Update record rankings"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
