# 순위 데이터 자동 갱신. 지금은 넷플릭스 대한민국 주간 TOP 10(영화·TV)을 갱신합니다.
# - 매주 수요일 12:00(KST): 새 주간이 있으면 데이터를 저장하고 GitHub Pages를 다시 배포합니다.
# - 직접 실행(Run workflow): 기본은 "미리보기"라서 결과만 보여주고 저장하지 않습니다.
name: Update ranking data

on:
  schedule:
    - cron: "0 3 * * 3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "미리보기만 (저장하지 않음)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  netflix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 넷플릭스 TOP 10 갱신
        run: node scripts/update-netflix.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: 바뀐 데이터 저장 후 사이트 재배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/rankings; then echo "바뀐 데이터가 없습니다"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings
          git commit -m "Update Netflix Korea weekly Top 10"
          git push
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
