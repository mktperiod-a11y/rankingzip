# 임시: 웹하드 로고 후보를 받아 같은 브랜치에 저장합니다. 로고를 고른 뒤 이 파일은 지웁니다.
name: Fetch logo candidates
on:
  push:
    branches: [claude/affectionate-einstein-6myk2z]
    paths: [scripts/fetch-logo-candidates.mjs, .github/workflows/fetch-logos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-logo-candidates.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-logos
          git commit -m "Add webhard logo candidates (temporary)" && git push || echo "nothing to commit"
