name: Collect missing images

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/build-github-pages.mjs "" out
      - name: 빠진 이미지 자동 수집
        env:
          POSTER_ISSUE_BODY: ${{ runner.temp }}/poster-issue.md
        run: node scripts/posters.mjs auto out
      - name: 저장 후 사이트 재배포
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -- tsconfig.tsbuildinfo 2>/dev/null || true
          if git diff --quiet -- data/rankings && [ -z "$(git status --porcelain public/ranking-images/auto)" ]; then echo "바뀐 이미지가 없습니다"; exit 0; fi
          node scripts/image-shapes.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings data/image-shapes.json public/ranking-images/auto
          git commit -m "Collect missing images"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
      - name: "'포스터 필요' 이슈 갱신"
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ runner.temp }}/poster-issue.md
        run: |
          title="포스터 필요"
          number="$(gh issue list --state open --search "in:title $title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          if [ -s "$BODY" ]; then
            if [ -n "$number" ]; then gh issue edit "$number" --body-file "$BODY"; else gh issue create --title "$title" --body-file "$BODY"; fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "빠진 이미지가 없습니다."
          fi
