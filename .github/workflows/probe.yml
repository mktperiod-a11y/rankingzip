name: Records update 2 (temporary)
on:
  push:
    branches: [claude/affectionate-einstein-6myk2z]
    paths: [scripts/update-records.mjs, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/update-records.mjs --only kaida,kboCrowd,population
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings/live
          git commit -m "자동 갱신 순위 2차 수집" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
