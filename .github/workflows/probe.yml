name: Fetch images and probe Laftel (temporary)
on:
  push:
    branches: [claude/affectionate-einstein-6myk2z]
    paths: [scripts/fetch-brand-images-2.mjs, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-brand-images-2.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ranking-images
          git commit -m "서비스 앱 아이콘·PC 게임 대표 이미지 수집" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
