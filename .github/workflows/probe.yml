name: Probe images (temporary)
on:
  push:
    branches: [claude/affectionate-einstein-6myk2z]
    paths: [scripts/probe.mjs, scripts/update-records.mjs, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe.mjs
      - run: node scripts/update-records.mjs --only ufc
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ranking-images/updates data/rankings/live
          git commit -m "사진·UFC 받기" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
