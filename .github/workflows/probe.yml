name: Fetch key art (temporary)
on:
  push:
    branches: [claude/affectionate-einstein-6myk2z]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/logo-sources
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          get() { curl -sSL -A "$UA" -H "Accept: image/avif,image/webp,image/*,*/*;q=0.8" -H "Accept-Language: ko-KR,ko;q=0.9" -e "$3" -o "$2" -w "$2 %{http_code} %{size_download}\n" "$1" || true; }
          true
          get "https://wsrv.nl/?url=i.namu.wiki/i/tb90_xgpeEn_7Q7v8OJ3_BGOki2_NzHMhXIeYP467uA10ABjrc0raosdToqAvcu3WzJJZVSDrbPIaDFSztM9HA.webp&output=webp" data/logo-sources/valorant-key.webp "https://wsrv.nl/"
          for f in data/logo-sources/*-key.*; do file "$f" | grep -q image || rm -f "$f"; done
          ls -la data/logo-sources
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/logo-sources
          git commit -m "롤·발로란트 키 아트 원본 수집" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
