# GitHub Pages 배포: main에 올라오면 사이트를 만들어 올립니다.
# Actions 탭에서 "Run workflow"를 눌러 직접 다시 만들 수도 있습니다.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # 기본 주소(https://<계정>.github.io/rankingzip/)면 "/rankingzip", 도메인을 연결하면 ""가 됩니다.
      - run: node scripts/build-github-pages.mjs "${{ steps.pages.outputs.base_path }}" out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
